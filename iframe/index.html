<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title id="page-title" data-i18n="Generate QR Code">生成二维码</title>
		<link rel="stylesheet" href="/iframe/css/style.css" />
		<script src="/iframe/js/script.js"></script>
		<script src="/iframe/js/JsBarcode.all.min.js"></script>
		<!-- 	二维码生成库 安装到本地 开源协议：MIT -->
		<script src="/iframe/js/qrcode.min.js"></script>
		<!-- 	条形码生成库 安装到本地 开源协议：MIT -->
	</head>
	<body>
		<div class="container">
			<main>
				<div class="input-section">
					<div class="form-group">
						<textarea id="qr-text" style="resize: none" placeholder="请输入内容" data-i18n-placeholder="Please enter content"></textarea>
					</div>
				</div>
				<div style="display: flex; width: 100%; gap: 10px">
					<button id="generate-btn" class="btn-primary" style="flex: 1" data-i18n="QR Code">二维码</button>
					<button id="getBrCode" class="btn-primary" style="flex: 1" data-i18n="Barcode">条形码</button>
					<button id="history-btn"class="btn-primary" style="flex: 1" data-i18n="Import from History">从历史导入</button>
				</div>
				<div style="display: flex; align-items: center; width: 100%; justify-content: start; margin-top: -15px">
					<label for="qr-size" id="lbl-size" style="white-space: nowrap; margin-right: 20px" data-i18n="Image Width (mm):">图片宽度(mm)：</label>
					<input id="InputSize" type="text" style="width: 70px; margin-right: 100px" value="100" />
					<input type="checkbox" name="color" id="buttontest" value="color" class="EDA_UI_FuXuanKuang" />
					<label for="buttontest" id="lbl-color" data-i18n="Generate Color Image">生成彩色图片</label>
					<input type="color" id="qr-color" value="#000000" />
				</div>
				<div style="display: flex; align-items: center; width: 100%; justify-content: start; margin-top: -15px">
					<label for="filename-input" id="lbl-filename" style="white-space: nowrap; margin-right: 20px" data-i18n="Filename:">文件名：</label>
					<input id="filename-input" type="text" style="width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" placeholder="输入文件名（不含扩展名）" data-i18n-placeholder="Enter filename (without extension)" />
				</div>
				<div class="output-section" style="margin-top: -15px">
					<div id="qr-result" class="qr-result">
						<div class="placeholder">
							<p id="lbl-preview" data-i18n="Preview">预览区</p>
						</div>
					</div>
				</div>
				<div
					class="color-picker"
					style="display: flex; align-items: center; justify-content: flex-start; flex-wrap: nowrap; gap: 10px; margin-top: -15px"
				>
					<input type="checkbox" name="CreateType" id="CreateType" class="EDA_UI_FuXuanKuang" />
					<label for="CreateType" id="lbl-coord" data-i18n="Place at Coordinates">放置在坐标</label>
					<p>x：<input type="text" id="xCoord" placeholder="输入X" value="0" data-i18n-placeholder="Enter X" /></p>
					<p>y：<input type="text" id="yCoord" placeholder="输入Y" value="0" data-i18n-placeholder="Enter Y" /></p>
				</div>
				<div id="download-section" class="download-section" style="margin-top: -15px">
					<div>
						<button id="download-btn" class="btn-secondary" data-i18n="Download">下载</button>
						<button id="Save-btn" class="btn-secondary" data-i18n="Save">保存</button>
					</div>
					<div>
						<button id="Create-btn" class="btn-secondary" data-i18n="Place">放置</button>
						<button id="Back-btn" class="btn-secondary" data-i18n="Cancel">取消</button>
					</div>
				</div>
			</main>
		</div>

		<!-- 引入二维码生成库 此处为CDN方式导入 如果EDA客户端需要完全断网 则不使用此方式导入 -->
		<!-- <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script> -->
	<script>
		var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
		function t(tag) {
			if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag);
			return tag;
		}
		function applyI18n() {
			var els = document.querySelectorAll('[data-i18n]');
			for (var i = 0; i < els.length; i++) {
				els[i].textContent = t(els[i].getAttribute('data-i18n'));
			}
			var phEls = document.querySelectorAll('[data-i18n-placeholder]');
			for (var i = 0; i < phEls.length; i++) {
				phEls[i].placeholder = t(phEls[i].getAttribute('data-i18n-placeholder'));
			}
		}
		applyI18n();
	</script>
	</body>
</html>

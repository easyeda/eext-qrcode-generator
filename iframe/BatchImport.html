<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量导入</title>
  <script src="/iframe/js/qrcode.min.js"></script>
  <script src="/iframe/js/JsBarcode.all.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      color: #333;
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .title-bar {
      padding: 8px 16px;
      font-size: 12px;
      color: #333;
      border-bottom: 1px solid #e9e9e9;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #e9e9e9;
      flex-shrink: 0;
    }

    .file-input { display: none; }

    .btn {
      display: inline-block;
      height: 28px;
      line-height: 28px;
      padding: 0 10px;
      border-radius: 2px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
      border: 1px solid transparent;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-primary {
      background: #1890ff;
      border-color: #1890ff;
      color: #fff;
    }
    .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; }
    .btn-primary:disabled {
      background: #d9d9d9;
      border-color: #d9d9d9;
      color: #fff;
      cursor: not-allowed;
    }

    .btn-default {
      background: #fff;
      border-color: #d9d9d9;
      color: #1890ff;
    }
    .btn-default:hover { border-color: #1890ff; }

    .table-wrapper { flex: 1; overflow: auto; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .data-table thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 25px;
      background: #ebebeb;
      border-bottom: 1px solid #e1e1e1;
      font-weight: 400;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      color: #333;
      padding: 0 6px;
      text-align: center;
      white-space: nowrap;
    }

    .data-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #e3e3e3;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      color: #333;
      vertical-align: middle;
      text-align: center;
    }

    .data-table tr:hover td { background: #e6f7ff; }

    .col-cb { width: 32px; }
    .col-preview { width: 40px; }
    .col-type { width: 72px; }
    .col-content { width: 35%; }
    .col-size { width: 66px; }
    .col-color { width: 120px; }
    .col-action { width: 52px; }

    .cell-input {
      width: 100%;
      height: 24px;
      padding: 0 6px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      color: #333;
      background: #fff;
      box-sizing: border-box;
      outline: none;
    }
    .cell-input:focus {
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
    }

    .cell-select {
      width: 100%;
      height: 24px;
      padding: 0 4px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      color: #333;
      background: #fff;
      box-sizing: border-box;
      outline: none;
      cursor: pointer;
    }
    .cell-select:focus {
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
    }

    .row-checkbox {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: #1890ff;
      vertical-align: middle;
    }

    .cell-preview {
      width: 24px;
      height: 24px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      object-fit: contain;
      display: inline-block;
      background: #fff;
    }
    .cell-preview.placeholder { background: #f5f5f5; }

    /* 放置按钮 */
    .row-place {
      height: 24px;
      line-height: 24px;
      padding: 0 8px;
      background: #1890ff;
      color: #fff;
      border: 1px solid #1890ff;
      border-radius: 2px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .row-place:hover { background: #40a9ff; border-color: #40a9ff; }

    /* 颜色列：彩色丝印复选框 + 颜色输入 */
    .color-cell-inner {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .color-cell-inner .cell-input {
      flex: 1;
      min-width: 60px;
    }

    .empty-state {
      text-align: center;
      color: #868686;
      padding: 40px 0;
      font-size: 12px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #e9e9e9;
      flex-shrink: 0;
      background: #fff;
    }

    .footer .select-all-wrap {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #333;
    }

    .eda-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1890ff;
      color: #fff;
      padding: 6px 16px;
      border-radius: 2px;
      font-size: 12px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      z-index: 99999;
      pointer-events: none;
      animation: toastAnim 3s forwards;
    }
    @keyframes toastAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      10%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    }
  </style>
</head>
<body>

  <div class="title-bar">批量生成二维码/条形码</div>

  <div class="toolbar">
    <button id="downloadTemplateBtn" class="btn btn-primary">下载模板</button>
    <input type="file" id="csvFileInput" class="file-input" accept=".csv">
    <button id="importCsvBtn" class="btn btn-primary" onclick="document.getElementById('csvFileInput').click()">导入表格</button>
    <button id="addRowBtn" class="btn btn-default">+ 添加行</button>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th class="col-cb"><input type="checkbox" class="row-checkbox" id="selectAll"></th>
          <th class="col-preview">预览</th>
          <th class="col-type">类型</th>
          <th class="col-content">内容</th>
          <th class="col-size">尺寸(mm)</th>
          <th class="col-color">彩色丝印</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row">
          <td colspan="7">
            <div class="empty-state">暂无数据，请导入表格或点击"+ 添加行"手动创建</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    <label class="select-all-wrap">
      <input type="checkbox" class="row-checkbox" id="selectAllFooter"> 全选
    </label>
    <button id="batchSaveBtn" class="btn btn-primary">批量保存到历史</button>
    <button id="closeBtn" class="btn btn-default">关闭</button>
  </div>

<script>
(function() {
  const tableBody = document.getElementById('tableBody');
  const selectAll = document.getElementById('selectAll');
  const selectAllFooter = document.getElementById('selectAllFooter');
  const batchSaveBtn = document.getElementById('batchSaveBtn');
  const closeBtn = document.getElementById('closeBtn');
  const csvFileInput = document.getElementById('csvFileInput');
  const downloadTemplateBtn = document.getElementById('downloadTemplateBtn');
  const addRowBtn = document.getElementById('addRowBtn');

  let rows = [];
  let rowIdCounter = 0;
  let followInterval = null;
  let currentImageID = null;

  const CSV_HEADER = '类型,内容,尺寸(mm),彩色丝印,颜色';
  const CSV_EXAMPLE = [
    '二维码,https://example.com,10,否,',
    '条形码,1234567890128,20,否,',
    '二维码,hello world,15,是,#1890ff'
  ].join('\n');

  function showToast(text) {
    var el = document.createElement('div');
    el.className = 'eda-toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 3000);
  }

  async function generatePreview(type, content, color) {
    if (!content || !content.trim()) return null;
    try {
      var canvas;
      if (type === 'qrcode') {
        canvas = await new Promise(function(resolve, reject) {
          QRCode.toCanvas(content.trim(), {
            width: 80, margin: 1, correctLevel: 3,
            color: { dark: color || '#000000', light: '#ffffff' }
          }, function(err, c) { if (err) reject(err); else resolve(c); });
        });
      } else {
        canvas = document.createElement('canvas');
        JsBarcode(canvas, content.trim(), {
          lineColor: color || '#000000',
          format: 'CODE128', width: 1, height: 40, displayValue: false, margin: 3
        });
      }
      return canvas.toDataURL('image/png');
    } catch(e) { return null; }
  }

  function renderRow(row) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-row-id', row.id);

    // 复选框
    var tdCb = document.createElement('td'); tdCb.className = 'col-cb';
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'row-checkbox row-cb';
    cb.checked = row.selected;
    cb.addEventListener('change', function() { row.selected = cb.checked; updateSelectAll(); });
    tdCb.appendChild(cb);

    // 预览
    var tdPreview = document.createElement('td'); tdPreview.className = 'col-preview';
    var img = document.createElement('img'); img.className = 'cell-preview';
    img.src = row.preview || '';
    if (!row.preview) img.classList.add('placeholder');
    tdPreview.appendChild(img);

    // 类型下拉
    var tdType = document.createElement('td'); tdType.className = 'col-type';
    var sel = document.createElement('select'); sel.className = 'cell-select';
    var optQr = document.createElement('option'); optQr.value = 'qrcode'; optQr.textContent = '二维码';
    var optBr = document.createElement('option'); optBr.value = 'barcode'; optBr.textContent = '条形码';
    sel.appendChild(optQr); sel.appendChild(optBr);
    sel.value = row.type;
    sel.addEventListener('change', function() { row.type = sel.value; refreshRow(row.id); });
    tdType.appendChild(sel);

    // 内容输入框（限制宽度）
    var tdContent = document.createElement('td'); tdContent.className = 'col-content';
    var inputContent = document.createElement('input');
    inputContent.type = 'text'; inputContent.className = 'cell-input';
    inputContent.value = row.content; inputContent.placeholder = '输入内容';
    var contentTimer;
    inputContent.addEventListener('input', function() {
      row.content = inputContent.value;
      clearTimeout(contentTimer);
      contentTimer = setTimeout(function() { refreshRow(row.id); }, 400);
    });
    tdContent.appendChild(inputContent);

    // 尺寸
    var tdSize = document.createElement('td'); tdSize.className = 'col-size';
    var inputSize = document.createElement('input');
    inputSize.type = 'text'; inputSize.className = 'cell-input';
    inputSize.value = row.size;
    inputSize.addEventListener('input', function() {
      var v = parseInt(inputSize.value, 10); row.size = isNaN(v) ? 10 : v;
    });
    tdSize.appendChild(inputSize);

    // 彩色丝印列：复选框 + 条件颜色输入
    var tdColor = document.createElement('td'); tdColor.className = 'col-color';
    var colorInner = document.createElement('div'); colorInner.className = 'color-cell-inner';
    var silkCb = document.createElement('input');
    silkCb.type = 'checkbox'; silkCb.className = 'row-checkbox';
    silkCb.checked = row.useColorSilk;
    silkCb.title = '彩色丝印';

    var colorInput = document.createElement('input');
    colorInput.type = 'text'; colorInput.className = 'cell-input';
    colorInput.value = row.color;
    colorInput.placeholder = '#000000';
    colorInput.style.display = row.useColorSilk ? '' : 'none';
    var colorTimer;

    silkCb.addEventListener('change', function() {
      row.useColorSilk = silkCb.checked;
      colorInput.style.display = row.useColorSilk ? '' : 'none';
      if (!row.useColorSilk) { row.color = '#000000'; colorInput.value = '#000000'; }
      refreshRow(row.id);
    });

    colorInput.addEventListener('input', function() {
      row.color = colorInput.value || '#000000';
      clearTimeout(colorTimer);
      colorTimer = setTimeout(function() { refreshRow(row.id); }, 400);
    });

    colorInner.appendChild(silkCb);
    colorInner.appendChild(colorInput);
    tdColor.appendChild(colorInner);

    // 放置按钮
    var tdAction = document.createElement('td'); tdAction.className = 'col-action';
    var placeBtn = document.createElement('button'); placeBtn.className = 'row-place';
    placeBtn.textContent = '放置';
    placeBtn.addEventListener('click', function() { placeSingle(row); });
    tdAction.appendChild(placeBtn);

    tr.appendChild(tdCb); tr.appendChild(tdPreview); tr.appendChild(tdType);
    tr.appendChild(tdContent); tr.appendChild(tdSize); tr.appendChild(tdColor);
    tr.appendChild(tdAction);
    return tr;
  }

  async function refreshRow(rowId) {
    var row = rows.find(function(r) { return r.id === rowId; });
    if (!row) return;
    if (row.content && row.content.trim()) {
      row.preview = await generatePreview(row.type, row.content, row.useColorSilk ? row.color : '#000000');
    } else {
      row.preview = null;
    }
    renderAll();
  }

  function renderAll() {
    tableBody.innerHTML = '';
    if (rows.length === 0) {
      tableBody.innerHTML = '<tr class="empty-row"><td colspan="7"><div class="empty-state">暂无数据，请导入表格或点击"+ 添加行"手动创建</div></td></tr>';
      return;
    }
    rows.forEach(function(row) { tableBody.appendChild(renderRow(row)); });
    updateSelectAll();
  }

  function addRow(data) {
    data = data || {};
    var row = {
      id: rowIdCounter++,
      type: data.type || 'qrcode',
      content: data.content || '',
      size: data.size || 10,
      color: data.color || '#000000',
      useColorSilk: !!data.useColorSilk,
      preview: null,
      selected: true
    };
    rows.push(row);
    renderAll();
    if (row.content) refreshRow(row.id);
  }

  function updateSelectAll() {
    var allChecked = rows.length > 0 && rows.every(function(r) { return r.selected; });
    selectAll.checked = allChecked;
    selectAll.indeterminate = !allChecked && rows.some(function(r) { return r.selected; });
    selectAllFooter.checked = allChecked;
    selectAllFooter.indeterminate = selectAll.indeterminate;
  }

  selectAll.addEventListener('change', function() {
    var checked = selectAll.checked;
    rows.forEach(function(r) { r.selected = checked; });
    renderAll();
  });

  selectAllFooter.addEventListener('change', function() {
    var checked = selectAllFooter.checked;
    rows.forEach(function(r) { r.selected = checked; });
    renderAll();
  });

  // ── 下载模板 ──
  downloadTemplateBtn.addEventListener('click', function() {
    var csvContent = CSV_HEADER + '\n' + CSV_EXAMPLE;
    var blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'qrcode_batch_template.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('模板已下载');
  });

  // ── 导入表格 ──
  csvFileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      var text = reader.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
      if (lines.length < 2) { showToast('表格内容为空或格式错误'); return; }
      var count = 0;
      for (var i = 1; i < lines.length; i++) {
        var cols = parseCSVLine(lines[i]);
        if (cols.length < 2) continue;
        var typeStr = (cols[0] || '').trim();
        var content = (cols[1] || '').trim();
        if (!content) continue;
        var size = parseInt(cols[2], 10) || 10;
        var useColorSilk = (cols[3] || '').trim();
        useColorSilk = useColorSilk === '是' || useColorSilk === 'yes' || useColorSilk === 'true' || useColorSilk === '1';
        var color = (cols[4] || '#000000').trim();
        if (!/^#/.test(color)) color = '#000000';
        var type = (typeStr === '条形码' || typeStr === 'barcode') ? 'barcode' : 'qrcode';
        addRow({ type: type, content: content, size: size, color: color, useColorSilk: useColorSilk });
        count++;
      }
      showToast('成功导入 ' + count + ' 条记录');
      csvFileInput.value = '';
    };
    reader.readAsText(file, 'UTF-8');
  });

  function parseCSVLine(line) {
    var result = [];
    var current = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = false; }
        } else { current += ch; }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ',') { result.push(current); current = ''; }
        else { current += ch; }
      }
    }
    result.push(current);
    return result;
  }

  addRowBtn.addEventListener('click', function() { addRow(); showToast('已添加新行'); });

  // ── 批量保存到历史 ──
  batchSaveBtn.addEventListener('click', async function() {
    var selected = rows.filter(function(r) { return r.selected; });
    if (selected.length === 0) { showToast('请至少勾选一条记录'); return; }
    var count = 0;
    for (var i = 0; i < selected.length; i++) {
      var row = selected[i];
      if (!row.content || !row.content.trim()) continue;
      var key = (row.type === 'qrcode' ? 'qrcode_' : 'barcode_') + Date.now() + '_' + i;
      var data = {
        type: row.type,
        content: row.content.trim(),
        size: row.size,
        color: row.useColorSilk ? row.color : '#000000',
        timestamp: new Date().toISOString(),
        useColorSilk: row.useColorSilk
      };
      try { await eda.sys_Storage.setExtensionUserConfig(key, data); count++; } catch(e) {}
    }
    showToast('成功保存 ' + count + ' 条记录到历史');
  });

  // ── 单行放置 ──
  async function placeSingle(row) {
    if (!row.content || !row.content.trim()) { showToast('请输入内容后再放置'); return; }
    if (followInterval) { clearInterval(followInterval); followInterval = null; }

    var color = row.useColorSilk ? row.color : '#000000';
    try {
      var base64 = await generatePreview(row.type, row.content, color);
      if (!base64) { showToast('生成失败: ' + row.content); return; }

      var size = row.size;
      var width = size / 0.0254;
      var height = size / 0.0254;
      if (row.type === 'barcode') width *= 3;

      var pt = await eda.pcb_SelectControl.getCurrentMousePosition();
      var obj = await eda.pcb_PrimitiveObject.create(
        EPCB_LayerId.TOP_SILKSCREEN, pt.x, pt.y,
        base64, width, height, 0, false, 'img', false
      );
      var ID = obj.getState_PrimitiveId();
      currentImageID = ID;

      showToast('图像已附着到鼠标，请点击画布放置');

      followInterval = setInterval(async function() {
        try {
          var pos = await eda.pcb_SelectControl.getCurrentMousePosition();
          await eda.pcb_PrimitiveObject.modify(currentImageID, { topLeftX: pos.x, topLeftY: pos.y });
        } catch(err) { if (followInterval) { clearInterval(followInterval); followInterval = null; } }
      }, 16);

    } catch(e) { showToast('放置失败: ' + (e.message || String(e))); }
  }

  window.onblur = function() {
    if (followInterval) {
      clearInterval(followInterval); followInterval = null; currentImageID = null;
      showToast('图像已放置');
    }
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && followInterval) {
      clearInterval(followInterval); followInterval = null; currentImageID = null;
      showToast('已取消放置');
    }
  });

  closeBtn.addEventListener('click', function() { eda.sys_IFrame.closeIFrame(''); });

  addRow();
})();
</script>
</body>
</html>

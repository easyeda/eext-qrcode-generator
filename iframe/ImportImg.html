<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title" data-i18n="Import Image">图片导入</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      color: #333;
      background: #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .title {
      font-size: 12px;
      color: #333;
      margin-bottom: 10px;
    }

    /* ── 文件选择区域 ── */
    .file-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .file-input {
      display: none;
    }

    .file-name {
      flex: 1;
      height: 24px;
      line-height: 24px;
      padding: 0 8px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      background: #fff;
      color: #868686;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name.has-file {
      color: #333;
    }

    /* ── 按钮 ── */
    .btn {
      display: inline-block;
      height: 28px;
      line-height: 28px;
      min-width: 96px;
      padding: 0 10px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
      text-decoration: none;
      flex-shrink: 0;
    }

    .btn-primary {
      background: #1890ff;
      border-color: #1890ff;
      color: #fff;
    }
    .btn-primary:hover {
      background: #40a9ff;
      border-color: #40a9ff;
    }
    .btn-primary:disabled {
      background: #d9d9d9;
      border-color: #d9d9d9;
      color: #fff;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-default {
      background: #fff;
      border-color: #d9d9d9;
      color: #1890ff;
    }
    .btn-default:hover {
      border-color: #1890ff;
    }

    /* ── 选项行 ── */
    .option-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .option-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .option-group input[type="checkbox"],
    .option-group input[type="radio"] {
      width: 15px;
      height: 15px;
      cursor: pointer;
      margin: 0;
      accent-color: #1890ff;
    }

    .option-group label {
      cursor: pointer;
      color: #333;
      line-height: 15px;
    }

    /* ── 预览区 ── */
    .preview-area {
      flex: 1;
      width: 100%;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      overflow: hidden;
    }

    .preview-area .placeholder {
      color: #868686;
    }

    .preview-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-area.drag-over {
      border-color: #1890ff;
      border-style: dashed;
      background: #e6f7ff;
    }

    /* ── 底部按钮 ── */
    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #e9e9e9;
    }

    /* ── Toast ── */
    .eda-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1890ff;
      color: #fff;
      padding: 6px 16px;
      border-radius: 2px;
      font-size: 12px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      z-index: 99999;
      pointer-events: none;
      animation: toastAnim 3s forwards;
    }
    @keyframes toastAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      10%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    }
  </style>
</head>
<body>

  <div class="title" id="desc-text" data-i18n="Select a PNG image to import to PCB silkscreen layer.">选择 PNG 图片，导入到 PCB 丝印层。</div>

  <div class="file-row">
    <input type="file" id="fileInput" class="file-input" accept=".png">
    <span class="file-name" id="fileName" data-i18n="No file selected">未选择文件</span>
    <label for="fileInput" class="btn btn-default" id="btn-select" data-i18n="Select Image">选择图片</label>
  </div>

  <div class="option-row">
    <div class="option-group">
      <input type="radio" name="layer" id="layerTop" value="top" checked>
      <label for="layerTop" id="lbl-top" data-i18n="Top Silkscreen">顶层丝印</label>
    </div>
    <div class="option-group">
      <input type="radio" name="layer" id="layerBottom" value="bottom">
      <label for="layerBottom" id="lbl-bottom" data-i18n="Bottom Silkscreen">底层丝印</label>
    </div>
    <div class="option-group">
      <input type="checkbox" id="invertCheckbox">
      <label for="invertCheckbox" id="lbl-invert" data-i18n="Invert">反相</label>
    </div>
  </div>

  <div class="preview-area" id="previewContainer">
    <span class="placeholder" id="lbl-preview" data-i18n="Image Preview">图片预览区域</span>
  </div>

  <div class="footer">
    <button id="importBtn" class="btn btn-primary" disabled data-i18n="Import">导入</button>
  </div>

<script>
  var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
  function t(tag, ...args) {
    if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
    return tag;
  }

  function applyI18n() {
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = t(els[i].getAttribute('data-i18n'));
    }
    var phEls = document.querySelectorAll('[data-i18n-placeholder]');
    for (var i = 0; i < phEls.length; i++) {
      phEls[i].placeholder = t(phEls[i].getAttribute('data-i18n-placeholder'));
    }
  }
  applyI18n();

  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const previewContainer = document.getElementById('previewContainer');
  const importBtn = document.getElementById('importBtn');
  const invertCheckbox = document.getElementById('invertCheckbox');
  const layerTop = document.getElementById('layerTop');
  const layerBottom = document.getElementById('layerBottom');

  let followInterval = null;
  let currentImageID = null;
  let originalImageData = null;

  function getLayerId() {
    return layerTop.checked ? EPCB_LayerId.TOP_SILKSCREEN : EPCB_LayerId.BOTTOM_SILKSCREEN;
  }

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && file.type === 'image/png') {
      fileName.textContent = file.name;
      fileName.classList.add('has-file');
      const reader = new FileReader();
      reader.onload = () => {
        originalImageData = reader.result;
        updatePreview();
        importBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    } else {
      showToast(t('Please select a valid PNG image'));
      resetPreview();
    }
  });

  // ── 拖放支持 ──
  previewContainer.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.stopPropagation();
    previewContainer.classList.add('drag-over');
  });

  previewContainer.addEventListener('dragleave', function(e) {
    e.preventDefault();
    e.stopPropagation();
    previewContainer.classList.remove('drag-over');
  });

  previewContainer.addEventListener('drop', function(e) {
    e.preventDefault();
    e.stopPropagation();
    previewContainer.classList.remove('drag-over');

    const file = e.dataTransfer.files[0];
    if (!file || file.type !== 'image/png') {
      showToast('请拖入有效的 PNG 图片');
      return;
    }

    fileName.textContent = file.name;
    fileName.classList.add('has-file');
    const reader = new FileReader();
    reader.onload = () => {
      originalImageData = reader.result;
      updatePreview();
      importBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  });

  // 防止浏览器默认打开拖入的文件
  document.body.addEventListener('dragover', function(e) {
    e.preventDefault();
  });
  document.body.addEventListener('drop', function(e) {
    e.preventDefault();
  });

  invertCheckbox.addEventListener('change', () => {
    if (originalImageData) updatePreview();
  });

  function updatePreview() {
    if (!originalImageData) return;

    if (invertCheckbox.checked) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          data[i]     = 255 - data[i];
          data[i + 1] = 255 - data[i + 1];
          data[i + 2] = 255 - data[i + 2];
        }
        ctx.putImageData(imageData, 0, 0);
        previewContainer.innerHTML = `<img src="${canvas.toDataURL()}" alt="${t('Preview')}">`;
      };
      img.src = originalImageData;
    } else {
      previewContainer.innerHTML = `<img src="${originalImageData}" alt="${t('Preview')}">`;
    }
  }

  function resetPreview() {
    previewContainer.innerHTML = '<span class="placeholder">' + t('Image Preview') + '</span>';
    importBtn.disabled = true;
    originalImageData = null;
    fileName.textContent = t('No file selected');
    fileName.classList.remove('has-file');
  }

  importBtn.addEventListener('click', async function() {
    const file = fileInput.files[0];
    if (!file) return;

    if (followInterval) {
      clearInterval(followInterval);
      followInterval = null;
    }

    try {
      const layerId = getLayerId();
      const layerName = layerTop.checked ? t('Top Silkscreen') : t('Bottom Silkscreen');
      await eda.pcb_Layer.selectLayer(layerId);

      const base64 = await getProcessedBase64();

      const img = new Image();
      await new Promise(resolve => { img.onload = resolve; img.src = base64; });
      const width = img.width;
      const height = img.height;

      const pt = await eda.pcb_SelectControl.getCurrentMousePosition();

      const obj = eda.pcb_PrimitiveObject.create(
        layerId,
        pt.x, pt.y,
        base64,
        width, height,
        0, false, 'img', false
      );
      const ID = (await obj).getState_PrimitiveId();
      currentImageID = ID;

      const prefix = invertCheckbox.checked ? t('Inverted') : '';
      showToast(t('${1}Image attached to mouse, target layer: ${2}, click canvas to place', prefix, layerName));

      followInterval = setInterval(async () => {
        try {
          const pos = await eda.pcb_SelectControl.getCurrentMousePosition();
          await eda.pcb_PrimitiveObject.modify(currentImageID, { topLeftX: pos.x, topLeftY: pos.y });
        } catch (err) {
          if (followInterval) { clearInterval(followInterval); followInterval = null; }
        }
      }, 16);

    } catch (error) {
      console.error(t('Import Failed'), error);
      showToast(t('Import Failed: ${1}', error.message || String(error)));
    }
  });

  function getProcessedBase64() {
    return new Promise((resolve, reject) => {
      if (!originalImageData) { reject(new Error(t('No image data'))); return; }
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        if (invertCheckbox.checked) {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          for (let i = 0; i < data.length; i += 4) {
            data[i]     = 255 - data[i];
            data[i + 1] = 255 - data[i + 1];
            data[i + 2] = 255 - data[i + 2];
          }
          ctx.putImageData(imageData, 0, 0);
        }
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = originalImageData;
    });
  }

  window.onblur = () => {
    if (followInterval) {
      clearInterval(followInterval);
      followInterval = null;
      currentImageID = null;
      showToast(t('Image placed'));
    }
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && followInterval) {
      clearInterval(followInterval);
      followInterval = null;
      currentImageID = null;
      showToast(t('Placement cancelled'));
    }
  });

  function showToast(text) {
    const el = document.createElement('div');
    el.className = 'eda-toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
</script>
</body>
</html>
